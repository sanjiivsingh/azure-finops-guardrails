name: "Infracost FinOps PR Gate"

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  infracost:
    name: "Infracost Cost Estimation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Infracost
        uses: infracost/actions/setup@v5
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Baseline
        run: |
          infracost breakdown --path=. --format=json --out-file=/tmp/infracost-base.json
        continue-on-error: true

      - name: Checkout PR Branch
        uses: actions/checkout@v4

      - name: Generate Infracost PR Diff
        run: |
          infracost diff --path=. --format=json --compare-to=/tmp/infracost-base.json --out-file=/tmp/infracost.json
        continue-on-error: true

      - name: Post Infracost PR Comment
        run: |
          echo "Infracost diff generation completed. See CI artifacts for cost delta breakdown."
